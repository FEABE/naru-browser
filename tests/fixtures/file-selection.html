<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Naru 파일 선택 검증</title>
<style>
  body { margin: 28px; max-width: 820px; color: #263747; background: #f5f7fb; font: 17px system-ui; }
  label { display: block; margin: 22px 0; }
  input, button { font: inherit; }
  button { margin: 4px 8px 4px 0; padding: 8px 12px; }
  pre { padding: 16px; background: white; white-space: pre-wrap; overflow-wrap: anywhere; }
  iframe { display: block; width: 100%; height: 520px; margin-top: 20px; border: 1px solid #bac6d3; }
  [hidden] { display: none; }
</style>
<h1>Naru 파일 선택 검증</h1>
<p id="scope">메인 문서</p>
<p>파일 이름, 크기, 개수와 이벤트 정보만 이 페이지에 표시합니다. 파일 내용과 경로를 읽거나 전송하지 않습니다.</p>
<label>파일 하나 <input type="file" id="single" aria-label="파일 하나 선택"></label>
<label>여러 파일 <input type="file" id="multiple" aria-label="여러 파일 선택" multiple></label>
<label>폴더 <input type="file" id="folder" aria-label="폴더 선택" webkitdirectory multiple></label>
<label>텍스트 파일 <input type="file" id="text-only" aria-label="텍스트 파일 선택" accept=".txt"></label>
<h2>선택 이벤트</h2>
<pre id="receipt" aria-label="파일 선택 이벤트 기록">[]</pre>
<section id="frame-controls" aria-label="프레임 검증 제어">
  <h2>같은 사이트 프레임</h2>
  <button type="button" id="add-frame">프레임 추가</button>
  <button type="button" id="navigate-frame">프레임 문서 이동</button>
  <button type="button" id="remove-frame">프레임 제거</button>
  <pre id="frame-state">{"present":false,"revision":0}</pre>
  <div id="frame-container"></div>
</section>
<script>
  const frameMode = new URL(location.href).searchParams.has('file-frame');
  document.querySelector('#scope').textContent = frameMode ? '같은 사이트 프레임 문서' : '메인 문서';
  document.querySelector('#frame-controls').hidden = frameMode;
  const events = [];
  function record(event) {
    const input = event.currentTarget;
    const selected = input.files;
    const files = [];
    // Limit displayed metadata without materializing an entire folder list.
    for (let index = 0; index < Math.min(selected.length, 64); index += 1) {
      files.push({ name: selected[index].name.slice(0, 256), size: selected[index].size });
    }
    events.push({
      input: input.id,
      event: event.type,
      isTrusted: event.isTrusted,
      count: selected.length,
      files,
      truncated: selected.length > files.length,
    });
    if (events.length > 12) events.shift();
    document.querySelector('#receipt').textContent = JSON.stringify(events, null, 2);
  }
  for (const input of document.querySelectorAll('input[type="file"]')) {
    input.addEventListener('input', record);
    input.addEventListener('change', record);
  }
  let frame = null;
  let revision = 0;
  function nextFrameUrl() {
    revision += 1;
    const url = new URL(location.href);
    url.search = '';
    url.hash = '';
    url.searchParams.set('file-frame', String(revision));
    return url.href;
  }
  function showFrameState(action) {
    document.querySelector('#frame-state').textContent = JSON.stringify({
      present: frame !== null, revision, action,
    });
  }
  document.querySelector('#add-frame').addEventListener('click', () => {
    if (frame || frameMode) return;
    frame = document.createElement('iframe');
    frame.id = 'file-frame';
    frame.title = '파일 선택 프레임';
    frame.src = nextFrameUrl();
    document.querySelector('#frame-container').append(frame);
    showFrameState('added');
  });
  document.querySelector('#navigate-frame').addEventListener('click', () => {
    if (!frame || frameMode) return;
    frame.src = nextFrameUrl();
    showFrameState('navigation-requested');
  });
  document.querySelector('#remove-frame').addEventListener('click', () => {
    if (!frame || frameMode) return;
    frame.remove();
    frame = null;
    showFrameState('removed');
  });
</script>
</html>
