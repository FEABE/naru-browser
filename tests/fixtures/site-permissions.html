<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Naru 사이트 권한 확인</title>
<style>
  body { margin: 28px; max-width: 820px; font: 17px system-ui; color: #263747; background: #f5f7fb; }
  button { font: inherit; padding: 10px 14px; margin: 4px 8px 8px 0; }
  section { padding: 18px; background: white; margin-bottom: 18px; border-radius: 14px; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  iframe { width: 100%; height: 520px; border: 1px solid #bac6d3; }
  [hidden] { display: none; }
</style>
<h1>사이트 권한 확인</h1>
<p id="scope">메인 문서</p>
<p>버튼을 누른 요청만 실행합니다. 알림을 보내거나 위치 좌표와 기기 이름을 읽지 않습니다. 미디어를 허용하면 반환된 트랙을 즉시 종료합니다.</p>
<section>
  <h2>위치와 알림</h2>
  <button type="button" id="notifications">알림 권한 요청</button>
  <button type="button" id="notification-state">알림 상태 확인</button>
  <button type="button" id="location">위치 권한 요청</button>
  <button type="button" id="location-state">위치 상태 확인</button>
</section>
<section>
  <h2>카메라와 마이크</h2>
  <p>실제 기기를 사용하는 승인은 별도 확인이 필요합니다. 거절과 취소 흐름은 기기 접근 없이 확인할 수 있습니다.</p>
  <button type="button" id="microphone">마이크 권한 요청</button>
  <button type="button" id="camera">카메라 권한 요청</button>
  <button type="button" id="both">카메라와 마이크 요청</button>
</section>
<section>
  <h2>요청 결과</h2>
  <pre id="receipt" aria-label="사이트 권한 결과">[]</pre>
</section>
<section id="frame-controls">
  <h2>같은 사이트 프레임</h2>
  <button type="button" id="add-frame">권한 프레임 추가</button>
  <button type="button" id="navigate-frame">권한 프레임 이동</button>
  <button type="button" id="remove-frame">권한 프레임 제거</button>
  <div id="frame-container"></div>
</section>
<script>
  const frameMode = new URL(location.href).searchParams.has('permission-frame');
  document.querySelector('#scope').textContent = frameMode ? '같은 사이트 프레임 문서' : '메인 문서';
  document.querySelector('#frame-controls').hidden = frameMode;
  const events = [];
  function record(kind, state) {
    events.push({ kind, state });
    if (events.length > 16) events.shift();
    document.querySelector('#receipt').textContent = JSON.stringify(events, null, 2);
  }
  const busy = new Set();
  async function run(kind, action) {
    if (busy.has(kind)) return;
    busy.add(kind);
    record(kind, 'requested');
    try {
      record(kind, await action());
    } catch (error) {
      record(kind, String(error.name || 'Error').slice(0, 80));
    } finally {
      busy.delete(kind);
    }
  }
  document.querySelector('#notifications').addEventListener('click', () => {
    run('notifications', () => Notification.requestPermission());
  });
  document.querySelector('#notification-state').addEventListener('click', () => {
    record('notification-state', Notification.permission);
  });
  document.querySelector('#location').addEventListener('click', () => {
    run('geolocation', () => new Promise(resolve => {
      navigator.geolocation.getCurrentPosition(
        () => resolve('position-returned-without-reading-coordinates'),
        error => resolve(`error-code-${error.code}`),
        { timeout: 15000, maximumAge: 0 },
      );
    }));
  });
  document.querySelector('#location-state').addEventListener('click', () => {
    run('geolocation-state', async () => (await navigator.permissions.query({ name: 'geolocation' })).state);
  });
  for (const [id, audio, video] of [
    ['microphone', true, false], ['camera', false, true], ['both', true, true],
  ]) {
    document.querySelector(`#${id}`).addEventListener('click', () => {
      run(id, async () => {
        const stream = await navigator.mediaDevices.getUserMedia({ audio, video });
        for (const track of stream.getTracks()) track.stop();
        return 'stream-returned-and-stopped';
      });
    });
  }
  let frame = null;
  let revision = 0;
  function frameUrl() {
    const url = new URL(location.href);
    url.search = '';
    url.hash = '';
    url.searchParams.set('permission-frame', String(++revision));
    return url.href;
  }
  document.querySelector('#add-frame').addEventListener('click', () => {
    if (frame || frameMode) return;
    frame = document.createElement('iframe');
    frame.title = '사이트 권한 프레임';
    frame.src = frameUrl();
    document.querySelector('#frame-container').append(frame);
  });
  document.querySelector('#navigate-frame').addEventListener('click', () => {
    if (frame && !frameMode) frame.src = frameUrl();
  });
  document.querySelector('#remove-frame').addEventListener('click', () => {
    if (!frame || frameMode) return;
    frame.remove();
    frame = null;
  });
</script>
</html>
