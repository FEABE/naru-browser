[package]
name = "light-browser"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["browser"]
browser = ["dep:cef", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:base64"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
cef = { path = "vendor/cef-rs/cef", default-features = false, features = ["sandbox"], optional = true }
base64 = { version = "0.22", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.3", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["objc2-core-foundation", "NSAppearance", "NSCell", "NSFontDescriptor", "NSColor", "NSFont", "NSScrollView", "NSClipView", "NSImage", "NSImageView", "NSApplication", "NSEvent", "NSResponder", "NSRunningApplication", "NSButton", "NSControl", "NSGraphics", "NSMenu", "NSMenuItem", "NSPopUpButton", "NSTextField", "NSView", "NSWindow"], optional = true }

[[bin]]
name = "light-browser"
path = "src/main.rs"
required-features = ["browser"]

[[bin]]
name = "light-browser-helper"
path = "src/bin/helper.rs"
required-features = ["browser"]

[[bin]]
name = "lightbrowser"
path = "src/bin/cli.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
